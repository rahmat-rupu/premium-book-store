<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist - Boimoi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-main">
    <!-- Premium Navbar -->
    <header class="navbar" style="border-bottom: 1px solid var(--border-color)">
      <div class="container nav-content">
        <a href="index.html" class="brand-logo">
          <span class="logo-text">বই<span class="highlight">মই</span></span>
        </a>

        <div
          class="nav-actions"
          style="display: flex; gap: 16px; align-items: center"
        >
          <a href="cart.html" class="action-icon cart-icon" title="Cart">
            <i class="fa-solid fa-shopping-bag"></i>
            <span class="cart-badge">০</span>
          </a>
          <a href="index.html" class="btn btn-outline-primary btn-small">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </header>

    <main class="section-padding">
      <div class="container">
        <h2
          style="
            font-size: 28px;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-dark);
          "
        >
          আপনার ফেভারিট বইগুলো
          <i class="fa-solid fa-heart" style="color: #8b1538"></i>
        </h2>

        <!-- Dynamic Wishlist Grid -->
        <div
          class="wishlist-items-container"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
          "
        >
          <!-- JS theke boi gulo ekhane load hobe -->
        </div>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
